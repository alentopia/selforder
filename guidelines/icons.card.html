<!-- @dsCard group="Brand" viewport="700x150" subtitle="Full glyph set, 35 icons" name="Icon Set" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>body{margin:0;padding:18px;background:var(--color-surface);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.cell span{font-size:8px;color:var(--color-faint)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NAMES = ['back','close','search','plus','minus','trash','cart','tag','arrowRight','lock','check','checkCircle','chevron','qr','phone','bolt','info','clock','edit','receipt','download','share','mail','instagram','table','gift','copy','fire','spark','user','pin','home','dineIn','takeaway','bell','megaphone','percent','coupon','whatsapp'];
function Icon({ name, size = 20, color = 'var(--color-ink)', stroke = 1.8 }) {
  const p = { fill: 'none', stroke: color, strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    back: <path d="M15 5l-7 7 7 7" {...p} />, close: <path d="M6 6l12 12M18 6L6 18" {...p} />,
    search: <g {...p}><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.2-3.2" /></g>, plus: <path d="M12 5v14M5 12h14" {...p} />,
    minus: <path d="M5 12h14" {...p} />, trash: <g {...p}><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" /><path d="M10 11v6M14 11v6" /></g>,
    cart: <g {...p}><path d="M4 5h2l2.2 11.5a1 1 0 0 0 1 .8h7.4a1 1 0 0 0 1-.8L20 8H7" /><circle cx="10" cy="20" r="1.3" /><circle cx="17" cy="20" r="1.3" /></g>,
    tag: <g {...p}><path d="M4 4h7l9 9-7 7-9-9V4z" /><circle cx="8.5" cy="8.5" r="1.4" /></g>, arrowRight: <path d="M4 12h15M13 6l6 6-6 6" {...p} />,
    lock: <g {...p}><path d="M8 11V8a4 4 0 0 1 8 0v3" /></g>, check: <path d="M5 13l4 4 10-11" {...p} />,
    checkCircle: <g {...p}><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9" /></g>, chevron: <path d="M9 5l7 7-7 7" {...p} />,
    qr: <g {...p}><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /></g>,
    phone: <g {...p}><rect x="7" y="3" width="10" height="18" rx="2.5" /></g>, bolt: <path d="M13 3 L6 13 H11 L10 21 L18 10 H13 L13 3 Z" {...p} />,
    info: <g {...p}><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></g>, clock: <g {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></g>,
    edit: <g {...p}><path d="M5 19h14M14 5l5 5-9 9H6v-4l8-10z" /></g>, receipt: <g {...p}><path d="M6 3h12v18l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V3z" /></g>,
    download: <g {...p}><path d="M12 4v11M8 11l4 4 4-4" /><path d="M5 19h14" /></g>, share: <g {...p}><circle cx="6" cy="12" r="2.4" /><circle cx="17" cy="6" r="2.4" /><circle cx="17" cy="18" r="2.4" /></g>,
    mail: <g {...p}><rect x="3" y="5" width="18" height="14" rx="2.5" /></g>, instagram: <g {...p}><rect x="3.5" y="3.5" width="17" height="17" rx="5" /><circle cx="12" cy="12" r="4" /></g>,
    table: <g {...p}><rect x="3" y="9" width="18" height="3" rx="1" /></g>, gift: <g {...p}><rect x="4" y="9" width="16" height="11" rx="1.5" /></g>,
    copy: <g {...p}><rect x="9" y="9" width="11" height="11" rx="2" /></g>, fire: <path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1.5.8-2.5 1.5-3 .2 1 .8 1.5 1.5 1.5.8 0 1-1 .3-2.2C10.5 5.5 11 4 12 3z" {...p} />,
    spark: <path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3z" {...p} />, user: <g {...p}><circle cx="12" cy="8" r="3.5" /></g>,
    pin: <g {...p}><path d="M12 21C12 21 5 13.5 5 9a7 7 0 0 1 14 0c0 4.5-7 12-7 12z" /></g>, home: <g {...p}><path d="M4 11l8-7 8 7" /></g>,
    dineIn: <g {...p}><path d="M12 3v10M8 3c0 3 1 5 4 6" /></g>, takeaway: <g {...p}><path d="M6 2h12l1 5H5L6 2z" /></g>,
    bell: <g {...p}><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z" /></g>, megaphone: <g {...p}><path d="M4 10v4h3l9 4V6l-9 4H4z" /></g>,
    percent: <g {...p}><circle cx="7.5" cy="7.5" r="1.9" /><circle cx="16.5" cy="16.5" r="1.9" /><path d="M18 6L6 18" /></g>,
    coupon: <g {...p}><path d="M3 7.5h18v3a1.5 1.5 0 0 0 0 3v3H3v-3a1.5 1.5 0 0 0 0-3v-3z" /></g>,
    whatsapp: <path fill={color} d="M12 2C6.5 2 2.1 6.4 2.1 11.9c0 1.7.5 3.4 1.3 4.9L2 22l5.2-1.4c1.5.8 3.1 1.2 4.8 1.2 5.5 0 9.9-4.4 9.9-9.9C21.9 6.4 17.5 2 12 2z" />
  };
  return <svg width={size} height={size} viewBox="0 0 24 24">{paths[name] || null}</svg>;
}
function Grid() {
  return <div className="grid">{NAMES.map(n => <div className="cell" key={n}><Icon name={n} /><span>{n}</span></div>)}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Grid />);
</script>
</body></html>
