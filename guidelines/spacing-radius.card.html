<!-- @dsCard group="Spacing" viewport="700x130" subtitle="12 / 18 / 26 / pill" name="Corner Radius" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body);display:flex;gap:16px;align-items:flex-end}
.box{background:var(--color-surface);border:1.5px solid var(--color-line-strong);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--color-muted);flex-direction:column;gap:2px}
strong{color:var(--color-ink);font-size:12px}</style></head>
<body>
<div class="box" style="width:88px;height:72px;border-radius:var(--radius-sm)"><strong>sm</strong>12px</div>
<div class="box" style="width:88px;height:72px;border-radius:var(--radius-md)"><strong>md</strong>18px</div>
<div class="box" style="width:88px;height:72px;border-radius:var(--radius-lg)"><strong>lg</strong>26px</div>
<div class="box" style="width:72px;height:72px;border-radius:var(--radius-pill)"><strong>pill</strong>999px</div>
</body></html>
