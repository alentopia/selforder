<!DOCTYPE html><html><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body)}
.row{display:flex;gap:10px}
.sw{width:110px;height:64px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:700}
.sw span{font-size:10px;opacity:.8;font-weight:500}</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#1799A5">Primary<span>#1799A5</span></div>
  <div class="sw" style="background:#B8893B">Accent<span>#B8893B</span></div>
  <div class="sw" style="background:rgba(23,153,165,.12);color:#13201F">Primary Soft<span style="color:#5C6B6A">10% tint</span></div>
  <div class="sw" style="background:rgba(184,137,59,.12);color:#13201F">Accent Soft<span style="color:#5C6B6A">12% tint</span></div>
</div>
</body></html>
