<!-- @dsCard group="Colors" viewport="700x110" subtitle="Porcelain (default) surfaces & ink" name="Neutral — Porcelain" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body)}
.row{display:flex;gap:10px}
.sw{width:110px;height:64px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:11px;font-weight:700;border:1px solid var(--color-line)}
.sw span{font-size:10px;opacity:.7;font-weight:500;display:block}</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--color-bg);color:var(--color-ink)">Bg<span>#EEF2F2</span></div>
  <div class="sw" style="background:var(--color-surface);color:var(--color-ink)">Surface<span>#FFFFFF</span></div>
  <div class="sw" style="background:var(--color-surface-2);color:var(--color-ink)">Surface 2<span>#F6F9F9</span></div>
  <div class="sw" style="background:var(--color-ink);color:#fff">Ink<span style="opacity:.8">#13201F</span></div>
  <div class="sw" style="background:var(--color-surface);color:var(--color-muted)">Muted<span>#5C6B6A</span></div>
</div>
</body></html>
