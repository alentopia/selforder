<!-- @dsCard group="Spacing" viewport="700x90" subtitle="4px base scale, 1–8" name="Spacing Scale" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body);display:flex;align-items:flex-end;gap:6px}
.bar{background:var(--color-primary);border-radius:3px 3px 0 0}
.lbl{font-size:10px;color:var(--color-muted);text-align:center;margin-top:4px}
.col{display:flex;flex-direction:column;align-items:center}</style></head>
<body>
<div class="col"><div class="bar" style="width:14px;height:4px"></div><span class="lbl">1</span></div>
<div class="col"><div class="bar" style="width:14px;height:8px"></div><span class="lbl">2</span></div>
<div class="col"><div class="bar" style="width:14px;height:12px"></div><span class="lbl">3</span></div>
<div class="col"><div class="bar" style="width:14px;height:16px"></div><span class="lbl">4</span></div>
<div class="col"><div class="bar" style="width:14px;height:20px"></div><span class="lbl">5</span></div>
<div class="col"><div class="bar" style="width:14px;height:24px"></div><span class="lbl">6</span></div>
<div class="col"><div class="bar" style="width:14px;height:32px"></div><span class="lbl">7</span></div>
<div class="col"><div class="bar" style="width:14px;height:40px"></div><span class="lbl">8</span></div>
</body></html>
