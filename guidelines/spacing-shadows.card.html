<!-- @dsCard group="Spacing" viewport="700x140" subtitle="Card / sheet / modal elevation" name="Shadows" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:var(--font-body);display:flex;gap:26px}
.box{width:120px;height:80px;background:var(--color-surface);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--color-muted);font-weight:600}</style></head>
<body>
<div class="box" style="box-shadow:var(--shadow-card)">card</div>
<div class="box" style="box-shadow:var(--shadow-sheet)">sheet</div>
<div class="box" style="box-shadow:var(--shadow-modal)">modal</div>
<div class="box" style="box-shadow:var(--shadow-button);background:var(--color-primary);color:#fff">button</div>
</body></html>
