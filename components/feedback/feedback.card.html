<!-- @dsCard group="Components" viewport="700x360" subtitle="Sheet, EmptyState, ConfirmDialog" name="Feedback" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>body{margin:0;background:var(--color-bg);font-family:var(--font-body)}
.wrap{display:flex;gap:16px;padding:16px}
.frame{position:relative;width:280px;height:320px;background:var(--color-surface-2);border-radius:16px;overflow:hidden}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function EmptyState({ title, desc, size = 96 }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', padding: 24 }}>
      <div style={{ width: size, height: size, marginBottom: 14, borderRadius: 16, background: 'var(--color-surface-2)', border: '1.5px dashed var(--color-line-strong)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--color-faint)', fontSize: 11, fontFamily: 'var(--font-mono)' }}>illustration</div>
      <p style={{ color: 'var(--color-ink)', fontSize: 15, fontWeight: 700, margin: 0 }}>{title}</p>
      <p style={{ color: 'var(--color-muted)', fontSize: 12.5, margin: '4px 0 0', lineHeight: 1.45 }}>{desc}</p>
    </div>
  );
}
function ConfirmCard() {
  return (
    <div style={{ width: '100%', maxWidth: 260, background: 'var(--color-surface)', borderRadius: 'var(--radius-lg)', padding: '20px 18px 16px', boxShadow: 'var(--shadow-card)' }}>
      <h3 style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 18, color: 'var(--color-ink)' }}>Hapus item?</h3>
      <p style={{ margin: '8px 0 16px', fontSize: 13, color: 'var(--color-muted)', lineHeight: 1.5 }}>Item akan dihapus dari keranjang.</p>
      <div style={{ display: 'flex', gap: 8 }}>
        <button style={{ flex: 1, height: 38, border: '1.5px solid var(--color-line-strong)', borderRadius: 'var(--radius-md)', background: 'transparent', fontWeight: 700, fontSize: 13 }}>Batal</button>
        <button style={{ flex: 1, height: 38, border: 'none', borderRadius: 'var(--radius-md)', background: 'var(--color-primary)', color: '#fff', fontWeight: 700, fontSize: 13 }}>Hapus</button>
      </div>
    </div>
  );
}
function SheetPreview() {
  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
      <div style={{ background: 'var(--color-surface)', borderTopLeftRadius: 'var(--radius-lg)', borderTopRightRadius: 'var(--radius-lg)', height: '62%', boxShadow: 'var(--shadow-sheet)' }}>
        <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 10 }}><div style={{ width: 36, height: 4, borderRadius: 999, background: 'var(--color-line-strong)' }} /></div>
        <div style={{ padding: '10px 18px' }}>
          <h3 style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 18, color: 'var(--color-ink)' }}>Pilih Varian</h3>
          <p style={{ fontSize: 12.5, color: 'var(--color-muted)' }}>Konten sheet scroll di sini.</p>
        </div>
      </div>
    </div>
  );
}
function Demo() {
  return (
    <div className="wrap">
      <div className="frame"><SheetPreview /></div>
      <div className="frame" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ConfirmCard /></div>
      <div className="frame" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}><EmptyState title="Keranjang masih kosong" desc="Yuk pilih menu favoritmu." /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
