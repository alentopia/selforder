<!-- @dsCard group="Components" viewport="700x150" subtitle="Photo placeholder w/ fallback" name="FoodImg" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>body{margin:0;padding:24px;background:var(--color-bg)}.row{display:flex;gap:14px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function shade(hex, amt) {
  const h = hex.replace('#', ''); let r = parseInt(h.slice(0,2),16)+amt,g=parseInt(h.slice(2,4),16)+amt,b=parseInt(h.slice(4,6),16)+amt;
  const cl = (x)=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0'); return '#'+cl(r)+cl(g)+cl(b);
}
function FoodImg({ label, h = 120, radius = 12, style, src }) {
  const [ok, setOk] = React.useState(false);
  const stripes = `repeating-linear-gradient(135deg, var(--color-placeholder) 0 10px, ${shade('#DDE6E6', -4)} 10px 20px)`;
  return (
    <div style={{ position: 'relative', height: h, borderRadius: radius, overflow: 'hidden', background: stripes, display: 'flex', alignItems: 'flex-end', ...style }}>
      {src && <img src={src} onLoad={() => setOk(true)} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: ok ? 1 : 0 }} />}
      {!ok && <span style={{ fontFamily: 'var(--font-mono)', fontSize: 9.5, color: 'var(--color-placeholder-ink)', padding: '5px 7px' }}>foto · {label}</span>}
    </div>
  );
}
function Demo() {
  return (
    <div className="row">
      <FoodImg label="nasi ayam" h={72} radius={10} style={{ width: 72 }} />
      <FoodImg label="iga bakar" h={72} radius={10} style={{ width: 72 }} src="https://images.unsplash.com/photo-1544025162-d76694265947?w=200&h=200&fit=crop" />
      <FoodImg label="sate ayam" h={72} radius={999} style={{ width: 72 }} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
