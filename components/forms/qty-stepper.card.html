<!-- @dsCard group="Components" viewport="700x180" subtitle="Quantity increment/decrement" name="QtyStepper" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:var(--font-body)}
.row{display:flex;gap:24px;align-items:center}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function QtyStepper({ value, onChange, min = 1, size = 'md' }) {
  const s = size === 'sm' ? 28 : 34;
  const btn = (label, fn, off) => <button onClick={off ? undefined : fn} style={{ width: s, height: s, borderRadius: 'var(--radius-pill)', border: 'none', cursor: off ? 'default' : 'pointer', background: 'transparent', color: off ? 'var(--color-faint)' : 'var(--color-primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 700 }}>{label}</button>;
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 2, background: 'var(--color-surface-2)', border: '1px solid var(--color-line)', borderRadius: 'var(--radius-pill)', padding: 2 }}>
      {btn('\u2212', () => onChange(Math.max(min, value - 1)), value <= min)}
      <span style={{ minWidth: 20, textAlign: 'center', fontWeight: 700, fontSize: size === 'sm' ? 14 : 15.5, color: 'var(--color-ink)' }}>{value}</span>
      {btn('+', () => onChange(value + 1))}
    </div>
  );
}
function Demo() {
  const [a, setA] = React.useState(2);
  const [b, setB] = React.useState(1);
  return (
    <div className="row">
      <QtyStepper value={a} onChange={setA} />
      <QtyStepper value={b} onChange={setB} size="sm" />
      <div style={{ width: 24, height: 24, borderRadius: '50%', background: 'var(--color-primary)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13 }}>3</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
