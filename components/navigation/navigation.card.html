<!-- @dsCard group="Components" viewport="700x300" subtitle="TopBar + OrderTypePills" name="Navigation" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>body{margin:0;background:var(--color-bg);font-family:var(--font-body)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function TopBar({ title, onBack, big, sub }) {
  return (
    <div style={{ paddingTop: 20, background: 'var(--color-bg)', borderBottom: '1px solid var(--color-line)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 16px 12px', minHeight: 44 }}>
        {onBack && <button style={{ border: 'none', background: 'var(--color-surface)', boxShadow: 'var(--shadow-card)', width: 40, height: 40, borderRadius: 999, cursor: 'pointer' }}>\u2190</button>}
        <div style={{ flex: 1 }}>
          {title && <div style={{ fontFamily: big ? 'var(--font-display)' : 'var(--font-body)', fontWeight: big ? 600 : 700, fontSize: big ? 26 : 17, color: 'var(--color-ink)' }}>{title}</div>}
          {sub && <div style={{ fontSize: 12.5, color: 'var(--color-muted)', marginTop: 2 }}>{sub}</div>}
        </div>
      </div>
    </div>
  );
}
function OrderTypePills({ value, onSelect }) {
  const opts = [{ id: 'dinein', label: 'Dine In' }, { id: 'takeaway', label: 'Take Away' }];
  return (
    <div style={{ display: 'inline-flex', gap: 4, padding: 4, background: 'var(--color-surface-2)', borderRadius: 12, border: '1px solid var(--color-line)', margin: 16 }}>
      {opts.map((o) => {
        const on = value === o.id;
        return <button key={o.id} onClick={() => onSelect(o.id)} style={{ padding: '8px 14px', borderRadius: 9, border: 'none', cursor: 'pointer', background: on ? 'var(--color-primary)' : 'transparent', fontFamily: 'var(--font-body)', fontSize: 13, fontWeight: 700, color: on ? '#fff' : 'var(--color-muted)' }}>{o.label}</button>;
      })}
    </div>
  );
}
function Demo() {
  const [v, setV] = React.useState('dinein');
  return (
    <div>
      <TopBar title="Keranjang" onBack={() => {}} />
      <TopBar big title="Selamat siang!" sub="Meja 12 · Dine In" />
      <OrderTypePills value={v} onSelect={setV} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
