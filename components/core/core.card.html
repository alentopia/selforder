<!-- @dsCard group="Components" viewport="700x420" subtitle="Button, Icon, Pill, Money" name="Core" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.lbl{font-size:11px;font-weight:700;color:var(--color-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}</style>
</head>
<body>
<div id="root"></div>
<!-- Preview copies (no ESM export) — the authoritative components live in Button.jsx / Icon.jsx / Pill.jsx / Money.jsx in this same directory. -->
<script type="text/babel">
function Button({ children, onClick, variant = 'primary', size = 'lg', disabled, full, icon, style }) {
  const sizes = { lg: { height: 54, fontSize: 16.5, padding: '0 22px' }, md: { height: 44, fontSize: 15, padding: '0 18px' }, sm: { height: 36, fontSize: 13.5, padding: '0 14px', borderRadius: 'var(--radius-sm)' } };
  const variants = {
    primary: { background: 'var(--color-primary)', color: 'var(--color-on-primary)', boxShadow: disabled ? 'none' : 'var(--shadow-button)' },
    ghost: { background: 'transparent', color: 'var(--color-ink)', border: '1.5px solid var(--color-line-strong)' },
    soft: { background: 'var(--color-primary-soft)', color: 'var(--color-primary)' },
    dark: { background: 'var(--color-ink)', color: 'var(--color-surface)' }
  };
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, fontFamily: 'var(--font-body)', fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer', border: 'none', borderRadius: 'var(--radius-md)', width: full ? '100%' : undefined, whiteSpace: 'nowrap', opacity: disabled ? 0.45 : 1 };
  return <button onClick={disabled ? undefined : onClick} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{icon}{children}</button>;
}
function Icon({ name, size = 22, color = 'currentColor', stroke = 2 }) {
  const p = { fill: 'none', stroke: color, strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    cart: <g {...p}><path d="M4 5h2l2.2 11.5a1 1 0 0 0 1 .8h7.4a1 1 0 0 0 1-.8L20 8H7" /><circle cx="10" cy="20" r="1.3" /><circle cx="17" cy="20" r="1.3" /></g>,
    tag: <g {...p}><path d="M4 4h7l9 9-7 7-9-9V4z" /><circle cx="8.5" cy="8.5" r="1.4" /></g>,
    coupon: <g {...p}><path d="M3 7.5h18v3a1.5 1.5 0 0 0 0 3v3H3v-3a1.5 1.5 0 0 0 0-3v-3z" /><path d="M13 7.5v1.5M13 13v1.5M13 18.5V20" /></g>,
    bell: <g {...p}><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z" /><path d="M10 20a2 2 0 0 0 4 0" /></g>,
    checkCircle: <g {...p}><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9" /></g>,
    trash: <g {...p}><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" /><path d="M10 11v6M14 11v6" /></g>,
    info: <g {...p}><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></g>,
    gift: <g {...p}><rect x="4" y="9" width="16" height="11" rx="1.5" /></g>,
    plus: <path d="M12 5v14M5 12h14" {...p} />
  };
  return <svg width={size} height={size} viewBox="0 0 24 24">{paths[name] || null}</svg>;
}
function Pill({ children, tone = 'neutral', icon, style }) {
  const tones = { neutral: { bg: 'var(--color-surface-2)', fg: 'var(--color-muted)', bd: 'var(--color-line)' }, primary: { bg: 'var(--color-primary-soft)', fg: 'var(--color-primary)', bd: 'transparent' }, danger: { bg: 'var(--color-danger-soft)', fg: 'var(--color-danger)', bd: 'transparent' } };
  const c = tones[tone] || tones.neutral;
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '4px 9px', borderRadius: 'var(--radius-pill)', background: c.bg, color: c.fg, border: '1px solid ' + c.bd, fontSize: 11, fontWeight: 700, letterSpacing: 0.3, textTransform: 'uppercase', fontFamily: 'var(--font-body)', ...style }}>{icon}{children}</span>;
}
function Money({ value, strike, style }) {
  const rupiah = (n) => 'Rp' + new Intl.NumberFormat('id-ID').format(Math.round(n || 0));
  const forced = strike ? { color: 'var(--color-muted)' } : { fontWeight: 700, color: 'var(--color-ink)' };
  return <span style={{ fontVariantNumeric: 'tabular-nums', textDecoration: strike ? 'line-through' : 'none', fontFamily: 'var(--font-body)', ...forced, ...style }}>{rupiah(value)}</span>;
}
function Demo() {
  return (
    <div>
      <div className="lbl">Button — variants</div>
      <div className="row">
        <Button>Konfirmasi Pesanan</Button>
        <Button variant="ghost">Batal</Button>
        <Button variant="soft" icon={<Icon name="plus" size={16} />}>Tambah</Button>
        <Button variant="dark">Bagikan</Button>
        <Button disabled>Nonaktif</Button>
      </div>
      <div className="lbl">Icon</div>
      <div className="row">
        {['cart','tag','coupon','bell','checkCircle','trash','info','gift'].map(n =>
          <Icon key={n} name={n} size={24} color="var(--color-ink)" stroke={1.8} />)}
      </div>
      <div className="lbl">Pill</div>
      <div className="row">
        <Pill tone="primary" icon={<Icon name="tag" size={12} />}>Promo</Pill>
        <Pill tone="danger">Stok Habis</Pill>
        <Pill tone="neutral">Sedang</Pill>
      </div>
      <div className="lbl">Money</div>
      <div className="row">
        <Money value={48000} style={{ fontSize: 18 }} />
        <div style={{ display: 'flex', gap: 6, alignItems: 'baseline' }}>
          <Money value={45000} strike style={{ fontSize: 13 }} />
          <Money value={48000} style={{ fontSize: 16 }} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
