<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#0d1815"/>
    <circle cx="50" cy="45" r="14" fill="#4fe8c9"/>
    <text x="50" y="80" font-size="12" fill="#cfe9e1" text-anchor="middle" font-family="monospace">SO</text>
  </svg>
</template>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 1440px;
    height: 1024px;
    overflow: hidden;
    background: #0b1210;
    font-family: 'Space Grotesk', sans-serif;
  }

  .canvas {
    position: relative;
    width: 1440px;
    height: 1024px;
    background:
      radial-gradient(ellipse 900px 700px at 78% 46%, rgba(45,158,140,0.30), transparent 70%),
      radial-gradient(ellipse 1200px 900px at 15% 90%, rgba(20,60,55,0.35), transparent 70%),
      linear-gradient(160deg, #0a1210 0%, #0d1815 55%, #0a1512 100%);
    overflow: hidden;
  }


  .kicker {
    position: absolute;
    top: 168px;
    left: 120px;
    width: 1440px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #6fd6c4;
  }

  .kicker::before {
    content: '';
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4fe8c9;
    box-shadow: 0 0 12px 3px rgba(79,232,201,0.7);
    margin-right: 14px;
    vertical-align: middle;
  }

  .title {
    position: absolute;
    top: 220px;
    left: 116px;
    width: 560px;
    font-size: 104px;
    font-weight: 700;
    line-height: 0.98;
    color: #f3f7f5;
    letter-spacing: -0.01em;
  }

  .title span {
    color: #4fe8c9;
  }

  .subtitle {
    position: absolute;
    top: 440px;
    left: 120px;
    width: 460px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.6;
    color: rgba(230,240,236,0.55);
  }

  .tags {
    position: absolute;
    top: 580px;
    left: 120px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    width: 460px;
  }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #cfe9e1;
    background: rgba(79,232,201,0.08);
    border: 1px solid rgba(79,232,201,0.35);
    border-radius: 100px;
    padding: 10px 20px;
  }

  .phones {
    position: absolute;
    top: 0;
    right: -60px;
    width: 780px;
    height: 1024px;
  }

  .phone {
    position: absolute;
    width: 260px;
    border-radius: 38px;
    box-shadow:
      0 40px 90px -20px rgba(0,0,0,0.65),
      0 0 0 1px rgba(255,255,255,0.06);
    overflow: hidden;
  }

  .phone img {
    display: block;
    width: 100%;
    height: auto;
  }

  .phone.p1 {
    top: 500px;
    left: 20px;
    transform: rotate(-10deg);
    z-index: 1;
    filter: brightness(0.75) saturate(0.9);
  }

  .phone.p2 {
    top: 190px;
    left: 260px;
    transform: rotate(-2deg);
    z-index: 2;
  }

  .phone.p3 {
    top: 460px;
    left: 500px;
    transform: rotate(9deg);
    z-index: 1;
    filter: brightness(0.75) saturate(0.9);
  }

  .glow-ring {
    position: absolute;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    border: 1px solid rgba(79,232,201,0.14);
    top: 240px;
    right: 20px;
  }

  .glow-ring.small {
    width: 400px;
    height: 400px;
    top: 320px;
    right: 100px;
    border-color: rgba(79,232,201,0.1);
  }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 120px;
    width: 800px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: rgba(230,240,236,0.35);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow-ring"></div>
    <div class="glow-ring small"></div>

    <div class="kicker">POS &amp; Self-Order</div>
    <div class="title">Self<br>Order<span>.</span></div>
    <div class="subtitle">Prototipe pemesanan mandiri berbasis QR — dari scan meja, pilih menu, promo, sampai checkout.</div>

    <div class="tags">
      <div class="tag">QR Statis / Dinamis</div>
      <div class="tag">Dine-in</div>
      <div class="tag">WhatsApp Login</div>
    </div>

    <div class="phones">
      <div class="phone p1"><img src="phone-01.png"></div>
      <div class="phone p3"><img src="phone-04.png"></div>
      <div class="phone p2"><img src="phone-02.png"></div>
    </div>


    <div class="footer">FIGMA COVER — 1440 × 1024</div>
  </div>
</body>
</html>
