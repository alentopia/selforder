<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% -10%, #1E2E2D 0%, #162020 45%, #0E1717 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  #root { height: 100%; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  input, textarea, button { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }

  @keyframes om-screen { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes om-sheet  { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes om-fade   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes om-spin   { to { transform: rotate(360deg); } }
  @keyframes om-blink  { 50% { opacity: 0; } }
  @keyframes om-pulse  { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
  @keyframes om-pop    { 0% { transform: scale(0); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; } }

  /* tactile press — shrink while held/clicked */
  .om-press { transition: transform .12s cubic-bezier(.3,.7,.4,1); }
  .om-press:active { transform: scale(.82); }

  /* brand logo slot — monogram shows behind; slot stays transparent when empty */
  image-slot#brand-logo::part(frame) { background: transparent; border: none; }
  image-slot#brand-logo::part(empty) { opacity: 0; }
  image-slot#brand-logo::part(ring) { display: none; }
</style>
</head>
