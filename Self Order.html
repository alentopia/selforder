<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Accurate POS · Self Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% -10%, #1E2E2D 0%, #162020 45%, #0E1717 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  #root { height: 100%; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  input, textarea, button { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }

  @keyframes om-screen { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes om-sheet  { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes om-fade   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes om-spin   { to { transform: rotate(360deg); } }
  @keyframes om-blink  { 50% { opacity: 0; } }
  @keyframes om-pulse  { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
  @keyframes om-pop    { 0% { transform: scale(0); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  /* Pembayaran berhasil — lingkaran muncul, centang tergambar, 2 ring menyusul (sekali per pesanan) */
  @keyframes om-success-in   { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes om-success-draw { to { stroke-dashoffset: 0; } }
  .om-success-circle { animation: om-success-in .4s cubic-bezier(0.23, 1, 0.32, 1) both; }
  .om-success-check  { stroke-dasharray: 1; stroke-dashoffset: 1; animation: om-success-draw .32s cubic-bezier(0.23, 1, 0.32, 1) .22s forwards; }
  .om-success-ring   { animation: om-success-in .5s cubic-bezier(0.23, 1, 0.32, 1) .12s both; }
  .om-success-ring.outer { animation-delay: .18s; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; } }
  /* reduced motion: centang & ring cukup memudar, tanpa gerak skala */
  @media (prefers-reduced-motion: reduce) {
    .om-success-circle, .om-success-ring { animation: om-fade .2s ease both !important; }
    .om-success-check { animation: none !important; stroke-dashoffset: 0; }
  }
  /* QRIS kedaluwarsa — illustration/qris-expired, timeline Figma 4,17 dtk (loop):
     lingkaran → kartu QR → lencana jam muncul berurutan, dua kilau berdenyut */
  @keyframes om-qx-bg    { 0% { opacity: 0; transform: scale(.7); animation-timing-function: ease-out; } 6%, 100% { opacity: 1; transform: scale(1); } }
  @keyframes om-qx-qr    { 0%, 1.92% { opacity: 0; transform: scale(.8); animation-timing-function: ease-out; } 7.91%, 100% { opacity: 1; transform: scale(1); } }
  @keyframes om-qx-badge { 0%, 4.8% { opacity: 0; transform: scale(0); animation-timing-function: ease-out; } 10.79%, 100% { opacity: 1; transform: scale(1); } }
  @keyframes om-qx-spark1 {
    0%, 8.39% { opacity: 0; transform: scale(0); animation-timing-function: ease-out; }
    13.19% { opacity: 1; transform: scale(1); animation-timing-function: ease-in-out; }
    32.37%, 51.56%, 70.74% { opacity: 1; transform: scale(1.15); animation-timing-function: ease-in-out; }
    22.78%, 41.97%, 61.15%, 80.34% { opacity: .35; transform: scale(.8); animation-timing-function: ease-in-out; }
    89.93%, 100% { opacity: 1; transform: scale(1.15); }
  }
  @keyframes om-qx-spark2 {
    0%, 10.07% { opacity: 0; transform: scale(0); animation-timing-function: ease-out; }
    14.87% { opacity: 1; transform: scale(1); animation-timing-function: ease-in-out; }
    40.05%, 59.23%, 78.42% { opacity: 1; transform: scale(1.15); animation-timing-function: ease-in-out; }
    30.46%, 49.64%, 68.82%, 88.01% { opacity: .35; transform: scale(.8); animation-timing-function: ease-in-out; }
    97.6%, 100% { opacity: 1; transform: scale(1.15); }
  }
  .om-qx { transform-origin: center; animation-duration: 4.17s; animation-iteration-count: infinite; animation-fill-mode: both; }
  .om-qx-bg { animation-name: om-qx-bg; }
  .om-qx-qr { animation-name: om-qx-qr; }
  .om-qx-badge { animation-name: om-qx-badge; }
  .om-qx-spark1 { animation-name: om-qx-spark1; }
  .om-qx-spark2 { animation-name: om-qx-spark2; }
  /* reduced motion: ilustrasi diam di bentuk akhirnya */
  @media (prefers-reduced-motion: reduce) { .om-qx { animation: none !important; } }

  /* tactile press — shrink while held/clicked */
  .om-press { transition: transform .12s cubic-bezier(.3,.7,.4,1); }
  .om-press:active { transform: scale(.82); }

  /* brand logo slot — monogram shows behind; slot stays transparent when empty */
  image-slot#brand-logo::part(frame) { background: transparent; border: none; }
  image-slot#brand-logo::part(empty) { opacity: 0; }
  image-slot#brand-logo::part(ring) { display: none; }
</style>
</head>
