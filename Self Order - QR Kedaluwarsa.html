<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% -10%, #1E2E2D 0%, #162020 45%, #0E1717 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  #root { height: 100%; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  input, textarea, button { font-family: inherit; }

  @keyframes qr-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .qr-badge { animation: qr-pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; } }
</style>
